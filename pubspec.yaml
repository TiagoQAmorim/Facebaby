name: facebaby_flutter
version: 1.0.29+95
publish_to: 'none'
description: MVP Flutter do FaceBaby, organizado com Page Objects/Screens, widgets, models, services e controllers.

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  table_calendar: ^3.1.2
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^0.4.5+4
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^8.0.6
  image_picker: ^1.1.2
  crop_your_image: ^2.0.0
  photo_view: ^0.15.0
  flutter_image_compress: ^2.4.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.2
  http: ^1.2.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  image: ^4.5.4
  pdf: ^3.11.3
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^5.0.2
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.4.10
  google_sign_in: ^6.2.2
  package_info_plus: ^8.3.0
  intl: ^0.20.2
  printing: ^5.14.3
  sign_in_with_apple: ^8.0.0
  crypto: ^3.0.7
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/app_icon.png
    background_color: "#F5F6F8"
    theme_color: "#5B6B8C"
  image_path: assets/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/data/baby_daily_tips_500.json
    - assets/data/family_zodiac_content.json
    - assets/data/family_christian_content.json
    - assets/auth/login_background.png
    - assets/logo.png
    - assets/google_g_logo.png
    - assets/app_icon.png
    - assets/sleep/baby_sleep.png
    - assets/sleep/baby_awake.png
    - assets/memories/mural_badges_ref.png
    - assets/memories/memory_album_cover.png
    - assets/weekly_photo/crown.png
    - assets/onboarding/
    - assets/family/
    - assets/memories/badges/
    - assets/memories/book/
    - assets/terms/
    - assets/privacy/
