name: facebaby_admin
description: FaceBaby Admin Web Panel — desktop-optimized, Firebase Auth protected.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.4.10
  cloud_functions: ^5.6.2
  google_sign_in: ^6.2.2
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  http: ^1.2.2
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/google_g_logo.png
